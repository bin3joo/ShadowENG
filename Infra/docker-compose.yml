version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-container
    restart: always
    environment:
      - POSTGRES_DB=shadoweng
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-container
    restart: always
    command: redis-server --requirepass ${REDIS_PWD}
    ports:
      - '6379:6379'

  springboot:
    build:
      context: ../BE
      dockerfile: Dockerfile
    image: springboot-app
    container_name: springboot-container
    restart: always
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-container:5432/shadoweng
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      - SPRING_DATA_REDIS_HOST=redis-container
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PWD}

      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PYTHON_API_BASE_URL=${PYTHON_API_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: