# ============================================================
# StyleEcho 기본 설정 (config_default.yaml)
# ============================================================
# 이 파일을 복사하여 config.yaml 으로 만들면 커스텀 설정이 적용됩니다.
# config.yaml 에는 변경할 항목만 넣어도 됩니다.
# (나머지는 이 기본값이 자동으로 사용됩니다)
# ============================================================

# ─────────────────────────────────────────────────
# WhisperX 모델 설정
# ─────────────────────────────────────────────────
whisper:
  # 사용할 WhisperX STT 모델 크기
  # 문자열 허용값: tiny, base, small, medium, large-v2, large-v3
  model: "large-v3"
  # 연산 디바이스
  # 문자열 허용값: cuda, cpu, auto
  # auto 는 GPU 사용 가능 시 cuda, 아니면 cpu 로 동작
  device: "auto"
  # WhisperX 추론 계산 타입
  # 문자열 허용값: float16, int8, float32
  # 일반적으로 GPU 는 float16, CPU 는 int8 권장
  compute_type: "float16"
  # transcribe 배치 크기. 크면 빠를 수 있지만 메모리 사용량 증가
  batch_size: 16

# ─────────────────────────────────────────────────
# 서버 설정
# ─────────────────────────────────────────────────
server:
  # FastAPI 바인딩 호스트. "0.0.0.0"이면 외부 접속 허용
  host: "0.0.0.0"
  # FastAPI 바인딩 포트 번호
  port: 8000

# ─────────────────────────────────────────────────
# Gemini LLM 설정
# ─────────────────────────────────────────────────
llm:
  # Gemini 모델명
  gemini_model: "gemini-2.0-flash"
  # Gemini API 프록시 base URL
  gemini_base_url: "https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com"
  # 레퍼런스 번역/병합 전용 시스템 지시문
  gemini_system_instruction: >
    You are an expert bilingual localization specialist and an English
    learning reference processor. Return strict JSON only. Merge only
    adjacent parts when they are clearly the same speaker's continuous
    utterance. Preserve every source part exactly once in order.
    Translate into natural, conversational Korean (구어체) like a movie
    subtitle, avoiding awkward literal translations. Extract highly
    reusable and practical learning expressions with detailed phonetic
    and contextual metadata. For each merged part, also extract 3 to 5
    useful vocabulary or idiomatic expressions with Korean meaning,
    English IPA, natural Korean phonetic spelling, and a practical
    example sentence with Korean translation.
  # Gemini API 요청 타임아웃(초)
  gemini_timeout_sec: 30
  # 번역 실패 시 최대 재시도 횟수
  gemini_max_retries: 3
  # 재시도 기본 backoff(초). 실제 대기 시간은 지수 증가
  gemini_retry_backoff_sec: 1.0
  # 번역/병합 생성 temperature
  gemini_temperature: 0.0
  # Gemini 최대 출력 토큰 수
  gemini_max_output_tokens: 8192

# ─────────────────────────────────────────────────
# 오디오 전처리
# ─────────────────────────────────────────────────
audio:
  # librosa 로드 및 분석에 사용할 목표 샘플레이트
  target_sr: 16000
  # F0 / RMS 프레임 추출 시 hop length. 작을수록 시간 해상도 증가
  hop_length: 256

# ─────────────────────────────────────────────────
# 디노이징 (Track B: 유저 오디오 분석용)
# ─────────────────────────────────────────────────
denoise:
  # 사용자 음성 분석 전에 디노이징 적용 여부
  enabled: true
  # 정상(stationary) 노이즈 가정 여부
  # true: 에어컨/팬/허밍처럼 지속적인 노이즈에 유리
  # false: 가변적 환경 노이즈에 더 보수적으로 대응
  stationary: true
  # 노이즈 감소 강도
  # 범위 예시: 0.0(거의 제거 안함) ~ 1.0(강한 제거, 왜곡 위험)
  prop_decrease: 0.6

# ─────────────────────────────────────────────────
# 레퍼런스 설정
# ─────────────────────────────────────────────────
reference:
  # 레퍼런스 분석용 디노이즈 모드
  # 문자열 허용값: off, light, moderate, strong, auto
  # auto 는 오디오 품질 메타데이터 기반 자동 선택
  denoise_mode: "auto"
  # diarization 적용 여부. true 면 화자 수 / 화자 전환 정보를 추정
  enable_diarization: true
  # diarization 모델 실행 디바이스
  # 문자열 허용값: cpu, cuda, auto
  # auto 는 구현체가 허용할 경우 자동 선택, 기본은 cpu 권장
  diarization_device: "cpu"
  # 고정 화자 수를 강제할지 여부
  # null 이면 자동 추정, 정수면 해당 화자 수를 강제
  diarization_num_speakers: null
  # diarization 자동 추정 시 최소 화자 수
  diarization_min_speakers: 1
  # diarization 자동 추정 시 최대 화자 수
  diarization_max_speakers: 3
  # risky 품질도 응답으로 허용할지 여부
  allow_risky: true
  # overlap 비율이 높을 때 reject 로 승격할지 여부
  reject_on_high_overlap: true
  # alignment 품질이 낮을 때 reject 로 승격할지 여부
  reject_on_low_alignment: true
  # 이 길이보다 짧은 part 만 short-part merge 후보가 됨
  min_part_duration_sec: 1.0
  # 짧은 part 를 앞/뒤와 병합할 때 허용하는 최대 시간 간격
  max_part_merge_gap_sec: 0.35
  # 이 단어 수 이하이면 short fragment 후보로 간주
  short_part_fragment_max_words: 2
  # 짧더라도 이 단어 수 이상이면 독립 part 로 유지
  short_part_keep_min_words: 3
  # short-part merge 에서 문장 끝 구두점(.?!) 보호를 사용할지 여부
  # true 면 terminal punctuation 가 있는 짧은 문장을 더 보수적으로 유지
  # false 면 구두점 유무를 무시하고 일반 short-part 규칙만 적용
  short_part_terminal_protection_enabled: true
  # terminal punctuation 이 있어도 최소 이 단어 수는 되어야 유지
  short_part_terminal_keep_min_words: 2
  # terminal punctuation 이 있는 짧은 part 의 최소 유지 길이(초)
  short_part_terminal_keep_min_duration_sec: 0.45
  # 이 값 이하의 느린 짧은 part 는 fragment 로 보고 병합 우선 고려
  short_part_merge_max_wpm: 80.0
  # 단어 간 gap 이 이 값 이상이면 dialog turn 분리 후보
  turn_gap_sec: 0.85
  # 한 turn 에 허용할 최대 단어 수. 넘으면 추가 분할 유도
  dialog_turn_max_words: 16
  # 화자 전환으로 볼 최소 gap. 너무 작으면 빠른 교차 발화에 민감해짐
  speaker_change_min_gap_sec: 0.08
  # speaker 기반 turn 을 유지하기 위한 최소 단어 수
  speaker_turn_min_words: 2
  # speaker 기반 turn 을 유지하기 위한 최소 길이(초)
  speaker_turn_min_duration_sec: 0.45
  # 짧은 speaker label 흔들림을 smoothing 할 최대 단어 수
  speaker_label_smoothing_max_words: 2
  # 짧은 speaker label 흔들림을 smoothing 할 최대 길이(초)
  speaker_label_smoothing_max_duration_sec: 0.6
  # noise_level = medium 판정 기준 SNR(dB)
  medium_noise_snr_db: 13.0
  # noise_level = high 판정 기준 SNR(dB)
  high_noise_snr_db: 7.0
  # speech ratio 가 이 값 미만이면 중간 수준 경고 고려
  medium_speech_ratio: 0.40
  # speech ratio 가 이 값 미만이면 낮은 음성 비율로 강한 경고 고려
  low_speech_ratio: 0.25
  # alignment median score 가 이 값 미만이면 저품질 정렬로 간주
  low_alignment_score: 0.40
  # low-confidence 단어 비율이 이 값 이상이면 정렬 품질 저하로 간주
  low_alignment_ratio: 0.60
  # overlap risk ratio 가 이 값 이상이면 높은 겹침으로 간주
  high_overlap_ratio: 0.42
  # overlap risk ratio 가 이 값 이상이면 중간 겹침 경고로 간주
  medium_overlap_ratio: 0.26
  # 인접 part 간 화자 변화 추정용 semitone 차이 기준
  speaker_shift_semitones: 7.0
  # 단일 화자 판정 시 각 part 의 dominant speaker 비율 최소값
  single_speaker_part_dominance_ratio: 0.7
  # 단일 화자 판정 시 전체 dominant speaker 비율 최소값
  single_speaker_dominant_ratio: 0.82
  # 단일 화자 판정 시 2등 화자 비율 허용 최대값
  single_speaker_max_second_ratio: 0.18
  # 단일 화자 판정 시 label change ratio 허용 최대값
  single_speaker_max_label_change_ratio: 0.45
  # 단일 화자 판정 시 multi-speaker risk part 비율 허용 최대값
  single_speaker_max_multi_part_ratio: 0.35
  # 단일 화자 판정 시 low-risk part 비율 최소값
  single_speaker_min_part_ratio: 0.7
  # 다중 화자 판정 시 2등 화자 비율 최소값
  multi_speaker_min_second_ratio: 0.22
  # 다중 화자 판정 시 label change ratio 최소값
  multi_speaker_min_label_change_ratio: 0.2
  # 다중 화자 판정 시 multi-speaker indicative part 비율 최소값
  multi_speaker_min_part_ratio: 0.25

# ─────────────────────────────────────────────────
# 유튜브 캡션 패딩
# ─────────────────────────────────────────────────
padding:
  # 유튜브 오디오 다운로드 시 요청 구간 앞뒤로 추가 확보하는 길이(초)
  # 현재 구현은 front / back 대칭 패딩
  audio_sec: 2.0
  # caption entry 가 padded window 에 겹쳐야 하는 최소 overlap 비율
  # 범위 예시: 0.0 ~ 1.0
  caption_min_entry_overlap_ratio: 0.5

# ─────────────────────────────────────────────────
# 구간 경계 정제 (trim_boundary_fragments)
# ─────────────────────────────────────────────────
trimming:
  # 앞부분 trim 시 저신뢰 단어로 볼 alignment score 임계치
  front_score_threshold: 0.65
  # 뒷부분 trim 시 저신뢰 단어로 볼 alignment score 임계치
  back_score_threshold: 0.38
  # 마지막 단어가 오디오 끝에 얼마나 가까우면 경계 잘림 후보로 볼지(초)
  boundary_gap_sec: 0.15
  # trim 후 남겨둘 최소 단어 수. 미만이면 빈 결과가 될 수 있음
  min_words: 2

# ─────────────────────────────────────────────────
# 스코어링 하이퍼파라미터
# ─────────────────────────────────────────────────
scoring:
  # 속도 유사도: speed_score = 100 * (min/max)^k
  # 값이 클수록 속도 차이에 더 민감
  speed_k: 1.2
  # 사용자가 기준보다 빠를 때 추가 패널티 강도
  speed_rushing_penalty: 1.3

  # 멈춤 유사도: pause_score = 100 * exp(-(diff^2) / (2*sigma^2))
  # 값이 클수록 pause 차이에 덜 민감
  pause_sigma: 2.5
  # pause 로 간주할 최소 무음 길이(초)
  pause_gap_sec: 0.3

  # 억양 DTW: prosody_score = 100 * exp(-beta * normalized_distance)
  # 값이 클수록 prosody distance 증가에 더 민감
  prosody_beta: 1.2
  # DTW 탐색 반경. 크면 유연하지만 계산량 증가
  prosody_dtw_radius: 10

  # 단어 리듬 민감도
  # 값이 클수록 리듬 차이에 더 민감
  rhythm_k: 1.2
  # 단어 길이/간격 차이를 리듬 차이로 볼 최소 기준
  rhythm_diff_threshold: 0.4

  # 문장 끝 억양 dead zone (semitone / unit)
  # 이 값 이하의 boundary tone 차이는 무시하는 dead zone
  boundary_slope_threshold: 0.55

  # AI 서버 pass/fail 기준점
  # 종합 점수가 이 값 이상이면 pass 로 해석 가능
  pass_threshold: 60.0

  # 종합 점수 가중치 (합 = 1.0)
  weights:
    # STT / alignment 기반 단어 정확도 가중치
    word_accuracy: 0.30
    # 문장 전체 억양 유사도 가중치
    prosody: 0.20
    # 단어 간 타이밍 / 리듬 유사도 가중치
    rhythm: 0.15
    # 문장 끝 억양 처리 가중치
    boundary_tone: 0.10
    # 강세 변화(dynamic stress) 가중치
    dynamic_stress: 0.10
    # 전체 발화 속도 유사도 가중치
    speed: 0.075
    # pause 패턴 유사도 가중치
    pause: 0.075

# ─────────────────────────────────────────────────
# 캡션 정렬 (align_text_to_audio) 고스트 워드 필터
# ─────────────────────────────────────────────────
alignment:
  # forced alignment 후 이 값 미만 confidence 단어는 ghost 로 보고 제거
  # 범위 예시: 0.0 ~ 1.0
  ghost_word_confidence: 0.1
  # caption_align 품질이 나쁠 때 Whisper STT 로 fallback 할지 여부
  caption_fallback_enabled: true
  # surviving word ratio 가 이 값 미만이면 fallback reason 추가
  caption_min_surviving_word_ratio: 0.55
  # surviving word ratio 가 매우 낮을 때 강한 fallback 신호로 사용
  caption_strong_min_surviving_word_ratio: 0.35
  # 앞부분 품질을 볼 때 검사할 초기 단어 수
  caption_front_window_words: 6
  # 앞부분 low-confidence 단어 비율 허용 최대값
  caption_max_front_low_conf_ratio: 0.5
  # 첫 surviving word 시작이 너무 늦으면 오정렬로 볼 leading gap 기준(초)
  caption_max_leading_gap_sec: 1.2
  # fallback reason 이 이 개수 이상이면 실제 Whisper STT fallback 수행
  caption_fallback_min_reason_count: 2
